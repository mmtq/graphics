<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raw WebGL 2 Fundamentals</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f1117;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f9fafb;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
      text-align: center;
      max-width: 500px;
    }
    canvas {
      width: 500px;
      height: 500px;
      border-radius: 12px;
      background-color: #08090d;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      padding: 4px 10px;
      border-radius: 9999px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Standalone WebGL 2</span>
    <h1>Fundamentals of Raw WebGL 2</h1>
    <p>A minimal pipeline demonstration: buffers, vertex arrays, programmable shaders, and animated uniforms.</p>
    <canvas id="gl-canvas" width="1000" height="1000"></canvas>
  </div>

  <script src="main.js"></script>
</body>
</html>
